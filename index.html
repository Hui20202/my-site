<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hui20202 · 绘梨衣</title>
  <style>
    /* ===== 基础 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1000px 700px at 78% 40%, rgba(255, 120, 160, .16), transparent 60%),
        radial-gradient(circle at 18% 12%, #241a2b 0%, #15121b 48%, #0b0910 100%);
      color: #f2eef5;
      overflow: hidden;
    }

    /* ===== 樱花 ===== */
    .petal {
      position: fixed; top: -8vh;
      width: 11px; height: 11px;
      background: radial-gradient(circle at 30% 30%, #ffd9e6, #ff8fb1);
      border-radius: 12px 2px 12px 2px;
      opacity: .5;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes fall {
      0%   { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(112vh) rotate(420deg); }
    }

    /* ===== 舞台：左文右图 ===== */
    .stage {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 4vw, 56px);
      padding: 24px clamp(18px, 5vw, 72px);
    }

    /* ---- 左：文字 ---- */
    .text { flex: 0 1 460px; min-width: 0; }

    .tag {
      display: inline-block;
      font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
      color: #ff9db9;
      border: 1px solid rgba(255, 143, 177, .35);
      border-radius: 999px;
      padding: 5px 12px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(30px, 5.2vw, 46px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: .02em;
      background: linear-gradient(100deg, #ffffff 15%, #ffc0d3 95%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 14.5px; line-height: 1.75; color: #b9b0c4;
      margin-bottom: 22px;
    }
    .sub code { color: #ffb3c9; font-family: ui-monospace, Consolas, monospace; font-size: 13.5px; }

    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .cell {
      padding: 10px 12px; border-radius: 11px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
    }
    .cell .k { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #8a8196; margin-bottom: 4px; }
    .cell .v { font-size: 13px; font-weight: 600; font-family: ui-monospace, Consolas, monospace; }

    .hint {
      font-size: 12px; color: #8a8196;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .hint::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: #ff8fb1; box-shadow: 0 0 10px #ff8fb1;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }

    /* ---- 右：立绘 ---- */
    .figure {
      position: relative;
      flex: 0 1 520px;
      height: min(80vh, 720px);
      display: flex; align-items: flex-end; justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .glow {
      position: absolute; inset: auto 50% 6% auto;
      width: 78%; aspect-ratio: 1;
      transform: translateX(50%);
      background: radial-gradient(circle, rgba(255,120,160,.30) 0%, rgba(255,120,160,.10) 45%, transparent 70%);
      filter: blur(18px);
      pointer-events: none;
    }

    .figure img {
      position: relative;
      height: 100%; width: auto; max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 24px 48px rgba(0,0,0,.55));
      transform-origin: 50% 92%;
      animation: breathe 5.2s ease-in-out infinite;
      transition: transform .3s ease;
    }
    /* 呼吸：轻微上下 + 极小幅缩放 */
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-7px) scale(1.012); }
    }
    .figure:hover img { filter: drop-shadow(0 26px 54px rgba(255,120,160,.28)); }
    .figure:active img { transform: scale(.995) translateY(0); }

    /* 台词气泡 */
    .bubble {
      position: absolute;
      left: 50%; top: 6%;
      transform: translate(-50%, -6px);
      max-width: 78%;
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(28, 20, 33, .88);
      border: 1px solid rgba(255,143,177,.35);
      color: #ffe9f1;
      font-size: 14.5px;
      line-height: 1.5;
      letter-spacing: .03em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
      box-shadow: 0 12px 30px rgba(0,0,0,.45);
    }
    .bubble.show { opacity: 1; transform: translate(-50%, 0); }

    .bubble::after {
      content: ""; position: absolute; left: 50%; bottom: -6px;
      width: 10px; height: 10px; margin-left: -5px;
      background: rgba(28, 20, 33, .88);
      border-right: 1px solid rgba(255,143,177,.35);
      border-bottom: 1px solid rgba(255,143,177,.35);
      transform: rotate(45deg);
    }

    /* 页脚 */
    footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 3;
      padding: 14px clamp(18px, 5vw, 72px);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      font-size: 11.5px; color: #6f6679;
    }
    footer .dot { color: #7ddc9a; }

    /* 窄屏：改成上下堆叠 */
    @media (max-width: 820px) {
      body { overflow-y: auto; }
      .stage { flex-direction: column-reverse; height: auto; min-height: 100%; padding-top: 34px; gap: 6px; }
      .figure { height: min(46vh, 400px); flex-basis: auto; }
      .text { flex-basis: auto; text-align: center; }
      .facts { text-align: left; }
      .hint { justify-content: center; }
      footer { position: static; margin-top: 18px; }
    }
  </style>
</head>
<body>

  <!-- 樱花 -->
  <div class="petal" style="left:6%;  animation-duration:12s; animation-delay:0s;"></div>
  <div class="petal" style="left:22%; animation-duration:15s; animation-delay:2.2s;"></div>
  <div class="petal" style="left:41%; animation-duration:13s; animation-delay:5.5s;"></div>
  <div class="petal" style="left:63%; animation-duration:17s; animation-delay:1.4s;"></div>
  <div class="petal" style="left:79%; animation-duration:14s; animation-delay:4.1s;"></div>
  <div class="petal" style="left:92%; animation-duration:16s; animation-delay:6.3s;"></div>

  <main class="stage">
    <!-- 左：文字 -->
    <section class="text">
      <span class="tag">first deploy · 绘梨衣</span>
      <h1>上杉绘梨衣</h1>
      <p class="sub">
        这张页面不在我的笔记本里，它跑在北大机房的一台云主机上，<br>
        7×24 开着。任何人在校园网里打开
        <code>http://10.129.246.200</code> 都能看到。
      </p>

      <div class="facts">
        <div class="cell"><span class="k">host</span><span class="v">zero-first</span></div>
        <div class="cell"><span class="k">system</span><span class="v">Ubuntu 24.04</span></div>
        <div class="cell"><span class="k">served by</span><span class="v">nginx</span></div>
        <div class="cell"><span class="k">updated</span><span class="v">2026-10-18</span></div>
      </div>

      <span class="hint">点她一下</span>
    </section>

    <!-- 右：立绘 -->
    <section class="figure" id="figure" role="button" tabindex="0" aria-label="绘梨衣，点击说话">
      <div class="glow"></div>
      <img src="assets/heriri.png" alt="上杉绘梨衣">
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <span><span class="dot">●</span> 在线 · 北大 CLab</span>
    <span>Hui20202 · 2026</span>
  </footer>

  <script>
    // 点她一下，换一句话（想改台词就改这个数组）
    const LINES = [
      "……",
      "食堂。",
      "没关系的。",
      "外面的世界，好大。",
      "我会写给你看的。"
    ];

    const figure = document.getElementById("figure");
    const bubble = document.getElementById("bubble");
    let i = 0, timer = null;

    function speak() {
      bubble.textContent = LINES[i % LINES.length];
      i++;
      bubble.classList.add("show");
      clearTimeout(timer);
      timer = setTimeout(() => bubble.classList.remove("show"), 3200);
    }

    figure.addEventListener("click", speak);
    figure.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); speak(); }
    });
  </script>
</body>
</html>
